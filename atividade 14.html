<!DOCTYPE html>
<html lang='ptbr'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Formulário</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <h1>Formulário de cadastro</h1>
<form action='atividade 03.html' method='post'> 
    <label for='Nome'> Seu nome: </label>
    <input type='text' id='nome' name='nome'>
<br>
<br>
    <label for='num'>Seu telefone: </label>
    <input type='tel' id='telefone' name='telefone'>
<br>
<br>
    <label for='email'>Seu email</label>
    <input type='email' id='email' name='email'>
<br>
<br>
    <label for='opc'>Deseja receber novidades?</label>
    <label for='opc'>Sim</label>
    <input type='radio' id='opc' name='opc'>
    <label for='opc'>Não</label>
    <input type='radio' id='opc' name='opc'>
<br>
<br>
    <label for='msg'>Sua mensagem</label>
    <textarea name='mensagem' id='mensagem' rows='4' cols="40" placeholder="Digite sua mensagem aqui"></textarea>
<br>
<br>
    <input type='submit' value='enviar'>
</form>
</body>
</html>
