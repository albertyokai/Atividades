<!DOCTYPE html>
<html lang='ptbr'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>
<style>
        label{
            font-weight: hold;
            margin-top: 6px;
        }
        input[type="txt"],
        input[type="email"],
        input[type="tel"],
        input[type="number"]
        input[type="date"]{

            margin-top: 8px;
            border-color: rgb(248, 250, 249);

        }
        fieldset{
            flex-direction: column;

            background-color: rgba(255, 255, 255, 0.699);
            border-width: 5px;
        }
        #botao{
            padding: 6px;
            margin-top: 8px;
            border-color: rgb(192, 219, 210);
            border-radius: 3px;
            background-color: azure;
        }
</style>
</head>
<body>
<form action=''>

<input type='submit' id="botao" value="sair">
