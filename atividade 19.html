    <link rel='stylesheet' href='main.css'>
<style>
        label{
            font-weight: hold;
            margin-top: 6px;

            background-image: url(https://img.magnific.com/vetores-gratis/estilo-de-papel-linhas-dinamicas-fundo_23-2149008629.jpg);
        }
</style>
</head>

</body>
<form action=''>
<fieldset>
       <h1>Formulário de contato</h1>

    <label for='nome'>Seu nome:</label>

    <input type='txt' id='registro'  name='Segundo nome'>

<br>

<input type='submit' id="botao" value="Enviar">
